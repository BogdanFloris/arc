[workspace]
resolver = "2"
members = [
    "arc-proto",
    "arc-core",
    "arcd",
    "arc",
    "arc-voice",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "json"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.4"
wiremock = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-tungstenite = "0.30"
crc32fast = "1"
tempfile = "3"

arc-core = { path = "arc-core" }
arc-proto = { path = "arc-proto" }

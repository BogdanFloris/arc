syntax = "proto3";

package arc.v1;

import "google/protobuf/timestamp.proto";
import "events.proto";

message SendMessage {
  string session_id = 1;
  string content = 2;
}

message SessionInfo {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp started_at = 3;
  string preview = 4;
  google.protobuf.Timestamp last_at = 5;
  SessionRole role = 6;
  string project = 7;
  // the session that dispatched it; empty for a root conversation
  string dispatched_by = 8;
  // who created the session: USER is a conversation (TUI or :code), MODEL
  // a dispatched job — the picker's split, correct for all history where
  // dispatched_by is only recorded from 6.34 on
  Source source = 9;
}

message ListSessions {}

message FetchHistory {
  string session_id = 1;
  reserved 2;
}

message MemoryReviewList {
  int64 since_micros = 1;
}

message MemoryReviewAccept {
  string record_id = 1;
}

message MemoryReviewDelete {
  string record_id = 1;
}

message ClientFrame {
  uint64 request_id = 1;
  oneof msg {
    SendMessage send_message = 11;
    ListSessions list_sessions = 12;
    FetchHistory fetch_history = 13;
    MemoryReviewList memory_review_list = 14;
    MemoryReviewAccept memory_review_accept = 15;
    MemoryReviewDelete memory_review_delete = 16;
    ListJobs list_jobs = 17;
    Subscribe subscribe = 18;
    CancelJob cancel_job = 19;
    DropSteers drop_steers = 20;
    CreateSession create_session = 21;
  }
}

// Creates a bound session directly — the TUI's :code door. No dispatch,
// no budget; the project's grants are recorded at creation and the reply
// is a MessageAccepted naming the new session.
message CreateSession {
  SessionRole role = 1;
  string project = 2;
}

// Stops a live job outright: drops its running turn, drains any queued
// steers, and hands back that the user cancelled it.
message CancelJob {
  string session_id = 1;
}

// Empties a live job's queued steers without touching its running turn.
message DropSteers {
  string session_id = 1;
}

// The response stream to a Subscribe never ends: Notification frames carry
// the subscription's request id for as long as the connection lives.
message Subscribe {}

message Notification {
  oneof event {
    // a session gained a durable event; refetch if it is on screen
    SessionAppended session_appended = 1;
    // a job started, progressed, or reached a terminal state
    JobInfo job_changed = 2;
    // the review queue changed; `pending` is its new size
    ReviewChanged review_changed = 3;
    // a job session's model is thinking; ephemeral, never in the log
    ReasoningDelta job_reasoning = 4;
  }
}

message ReviewChanged {
  uint32 pending = 1;
}

message SessionAppended {
  string session_id = 1;
}

message ListJobs {}

// Live daemon state, not archive: the list is rebuilt empty on restart,
// and a job's durable record is its child session.
message JobInfo {
  string session_id = 1;
  SessionRole role = 2;
  string project = 3;

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_RUNNING = 1;
    STATE_FINISHED = 2;
    STATE_FAILED = 3;
    STATE_OVER_BUDGET = 4;
  }
  State state = 4;

  uint64 spent_tokens = 5;
  uint64 budget_tokens = 6;
  uint32 elapsed_seconds = 7;
  uint32 budget_seconds = 8;
  string title = 9;
  // tool-call steps completed so far, one per issued call; 0 until the
  // first tool step, so the strip can tell "thinking" from "working"
  uint32 tool_steps = 10;
  // wall-clock seconds since the job's last engine event (delta,
  // reasoning, or tool activity); the strip ticks this forward locally
  uint32 idle_seconds = 11;
  // the session that dispatched it, for scoping the ambient strip
  string parent_session = 12;
  // steer/continue_job messages waiting for their own turn
  uint32 queued_steers = 13;
  // the last issued tool call, elided ("bash cargo test"); empty until
  // the first call, when the strip falls back to the step count
  string last_call = 14;
}

message JobList {
  repeated JobInfo jobs = 1;
}

message MessageAccepted {
  string session_id = 1;
}

message Delta {
  string session_id = 1;
  string text = 2;
}

message ReasoningDelta {
  string session_id = 1;
  string text = 2;
}

message ToolCallStarted {
  string session_id = 1;
  string call_id = 2;
  uint32 index = 3;
  string name = 4;
  reserved 5;
  string arguments_json = 6;
}

message ToolCallEnded {
  string session_id = 1;
  string call_id = 2;
  ToolOutcome outcome = 3;
  reserved 4;
}

message StreamEnd {
  string session_id = 1;
  uint32 input_tokens = 2;
  uint32 output_tokens = 3;
  bool partial = 4;
  // the turn used every tool step its role allows and was forced to stop;
  // the reply narrates in-progress work, not a finished answer
  bool step_capped = 5;
}

message Error {
  string code = 1;
  string msg = 2;
}

message SessionList {
  repeated SessionInfo sessions = 1;
}

message HistoryMessage {
  Role role = 1;
  string content = 2;
  bool partial = 3;
  // who wrote it: a handback is SYSTEM where the user's words are USER
  Source source = 4;
  uint32 input_tokens = 5;
  uint32 output_tokens = 6;
  uint32 elapsed_ms = 7;
}

message HistoryToolCall {
  string call_id = 1;
  string name = 2;
  string arguments_json = 3;
}

message HistoryToolResult {
  string call_id = 1;
  ToolOutcome outcome = 2;
  bool truncated = 3;
}

message HistoryEntry {
  oneof entry {
    HistoryMessage message = 1;
    HistoryToolCall tool_call = 2;
    HistoryToolResult tool_result = 3;
  }
}

message SessionHistory {
  reserved 2;  // was `messages`, a prose-only copy of `entries`
  string session_id = 1;
  repeated HistoryEntry entries = 3;
}

message MemoryReviewItem {
  MemoryRecord record = 1;
  int64 changed_at_micros = 2;
  string superseded_by = 3;
}

message MemoryReviewItems {
  repeated MemoryReviewItem items = 1;
}

message ServerFrame {
  uint64 request_id = 1;
  oneof msg {
    SessionList session_list = 10;
    MessageAccepted message_accepted = 11;
    Delta delta = 12;
    StreamEnd stream_end = 13;
    Error error = 14;
    SessionHistory session_history = 15;
    ReasoningDelta reasoning_delta = 16;
    ToolCallStarted tool_call_started = 17;
    ToolCallEnded tool_call_ended = 18;
    MemoryReviewItems memory_review_items = 19;
    JobList job_list = 20;
    Notification notification = 21;
  }
}

syntax = "proto3";

package arc.v1;

import "google/protobuf/timestamp.proto";
import "events.proto";

message SendMessage {
  string session_id = 1;
  string content = 2;
  // 3, 4 reserved for provider/model override
}

message SessionInfo {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp started_at = 3;
  // The session's first user message, verbatim and untruncated — a stand-in
  // label so a picker has something to show. Distinct from `title`, which
  // stays empty until Phase 2 generates one. Empty if the session has no
  // user message yet.
  string preview = 4;
  // When the session was last spoken in, either side. Unset for a session
  // with no messages, where `started_at` is the only time there is. This is
  // what a picker orders by: what you were last doing, not what you started
  // first.
  google.protobuf.Timestamp last_at = 5;
}

message ListSessions {}

// Ask for a session's messages. Phase 1 answers with the whole history:
// unpaginated, like ListSessions. Paging is a wire question (DESIGN.md §7)
// and gets answered when a real session makes it one.
message FetchHistory {
  string session_id = 1;
  reserved 2; // a paging cursor, when it is needed
}

message ClientFrame {
  uint64 request_id = 1; // client-chosen, echoed back
  oneof msg {
    SendMessage send_message = 11;
    ListSessions list_sessions = 12;
    FetchHistory fetch_history = 13;
  }
}

message MessageAccepted {
  string session_id = 1;
}

message Delta {
  string session_id = 1;
  string text = 2;
}

// The model's thinking, delta by delta, the way Delta carries its text. Never
// durable (DESIGN.md §3.1): a client that missed it live cannot fetch it back.
message ReasoningDelta {
  string session_id = 1;
  string text = 2;
}

// A named tool call started. `call_id` is the log's id for the call and is what
// pairs this with its ToolCallEnded — a step can run calls in parallel, so
// adjacency pairs nothing. `index` is the order within the step, dense from 0.
message ToolCallStarted {
  string session_id = 1;
  string call_id = 2;
  uint32 index = 3;
  string name = 4;
  reserved 5; // the call's arguments, if a client ever renders them
}

// The call `call_id` finished. No tool name: ToolCallStarted carried it, and a
// second copy is a second thing that can be wrong.
message ToolCallEnded {
  string session_id = 1;
  string call_id = 2;
  ToolOutcome outcome = 3;
  reserved 4; // a preview of the result, if a client ever renders one
}

message StreamEnd {
  string session_id = 1;
  uint32 input_tokens = 2;
  uint32 output_tokens = 3;
  // Reply was cut before the model finished; the deltas are what the user saw.
  bool partial = 4;
}

message Error {
  string code = 1;
  string msg = 2;
}

message SessionList {
  repeated SessionInfo sessions = 1;
}

// One past message, as the projection has it.
message HistoryMessage {
  Role role = 1;
  string content = 2;
  // Reply was cut before the model finished; content is what the user saw.
  bool partial = 3;
}

message SessionHistory {
  string session_id = 1;
  repeated HistoryMessage messages = 2;
}

// A turn is MessageAccepted, then any number of Delta, ReasoningDelta,
// ToolCallStarted and ToolCallEnded frames in the order the turn produced them,
// then one StreamEnd or one Error. A client that renders none of the middle
// frames still sees a whole turn: skipping arms it does not render is what
// keeps this protocol additive. (An arm a binary predates decodes as an empty
// msg — the wire shares §3 rule 3's ships-together boundary.)
message ServerFrame {
  uint64 request_id = 1; // 0 = unsolicited
  oneof msg {
    SessionList session_list = 10;
    MessageAccepted message_accepted = 11;
    Delta delta = 12;
    StreamEnd stream_end = 13;
    Error error = 14;
    SessionHistory session_history = 15;
    ReasoningDelta reasoning_delta = 16;
    ToolCallStarted tool_call_started = 17;
    ToolCallEnded tool_call_ended = 18;
  }
}

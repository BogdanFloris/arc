syntax = "proto3";

package arc.v1;

import "google/protobuf/timestamp.proto";
import "events.proto";

message SendMessage {
  string session_id = 1;
  string content = 2;
}

message SessionInfo {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp started_at = 3;
  string preview = 4;
  google.protobuf.Timestamp last_at = 5;
}

message ListSessions {}

message FetchHistory {
  string session_id = 1;
  reserved 2;
}

message MemoryReviewList {
  int64 since_micros = 1;
}

message MemoryReviewAccept {
  string record_id = 1;
}

message MemoryReviewDelete {
  string record_id = 1;
}

message ClientFrame {
  uint64 request_id = 1;
  oneof msg {
    SendMessage send_message = 11;
    ListSessions list_sessions = 12;
    FetchHistory fetch_history = 13;
    MemoryReviewList memory_review_list = 14;
    MemoryReviewAccept memory_review_accept = 15;
    MemoryReviewDelete memory_review_delete = 16;
  }
}

message MessageAccepted {
  string session_id = 1;
}

message Delta {
  string session_id = 1;
  string text = 2;
}

message ReasoningDelta {
  string session_id = 1;
  string text = 2;
}

message ToolCallStarted {
  string session_id = 1;
  string call_id = 2;
  uint32 index = 3;
  string name = 4;
  reserved 5;
}

message ToolCallEnded {
  string session_id = 1;
  string call_id = 2;
  ToolOutcome outcome = 3;
  reserved 4;
}

message StreamEnd {
  string session_id = 1;
  uint32 input_tokens = 2;
  uint32 output_tokens = 3;
  bool partial = 4;
}

message Error {
  string code = 1;
  string msg = 2;
}

message SessionList {
  repeated SessionInfo sessions = 1;
}

message HistoryMessage {
  Role role = 1;
  string content = 2;
  bool partial = 3;
}

message HistoryToolCall {
  string call_id = 1;
  string name = 2;
}

message HistoryToolResult {
  string call_id = 1;
  ToolOutcome outcome = 2;
  bool truncated = 3;
}

message HistoryEntry {
  oneof entry {
    HistoryMessage message = 1;
    HistoryToolCall tool_call = 2;
    HistoryToolResult tool_result = 3;
  }
}

message SessionHistory {
  string session_id = 1;
  repeated HistoryMessage messages = 2;
  repeated HistoryEntry entries = 3;
}

message MemoryReviewItem {
  MemoryRecord record = 1;
  int64 changed_at_micros = 2;
  string superseded_by = 3;
}

message MemoryReviewItems {
  repeated MemoryReviewItem items = 1;
}

message ServerFrame {
  uint64 request_id = 1;
  oneof msg {
    SessionList session_list = 10;
    MessageAccepted message_accepted = 11;
    Delta delta = 12;
    StreamEnd stream_end = 13;
    Error error = 14;
    SessionHistory session_history = 15;
    ReasoningDelta reasoning_delta = 16;
    ToolCallStarted tool_call_started = 17;
    ToolCallEnded tool_call_ended = 18;
    MemoryReviewItems memory_review_items = 19;
  }
}

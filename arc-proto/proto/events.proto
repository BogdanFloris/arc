syntax = "proto3";

package arc.v1;

import "google/protobuf/timestamp.proto";

enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_MODEL = 1;
  SOURCE_USER = 2;
  SOURCE_SYSTEM = 3;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
}

message SessionCreated {
  string session_id = 1;
  string title = 2;
  string provider = 3;
  string model = 4;
  reserved 5, 6; // reserved for parent_session and fork_point
}

message MessageAppended {
  string session_id = 1;
  Role role = 2;
  string content = 3;
  // Reply was cut before the model finished; content is what the user saw.
  bool partial = 4;
  string turn_id = 5;
}

message ToolCallIssued {
  string session_id = 1;
  string turn_id = 2;
  string call_id = 3;
  uint32 index = 4;
  string name = 5;
  string arguments_json = 6;
  reserved 7, 8; // reserved for tool source (MCP server id) and issuing model
}

enum ToolOutcome {
  TOOL_OUTCOME_UNSPECIFIED = 0;
  TOOL_OUTCOME_OK = 1;
  TOOL_OUTCOME_ERROR = 2;
  TOOL_OUTCOME_UNKNOWN = 3;
}

message ToolResultRecorded {
  string session_id = 1;
  string turn_id = 2;
  string call_id = 3;
  ToolOutcome outcome = 4;
  string content = 5;
  bool truncated = 6;
  reserved 7; // reserved for structured (non-text) result content
}

message SessionEvent {
  oneof event {
    SessionCreated session_created = 1;
    MessageAppended message_appended = 2;
    ToolCallIssued tool_call_issued = 3;
    ToolResultRecorded tool_result_recorded = 4;
  }
  reserved 5; // reserved for a reasoning event; streamed-only by decision
}

message Event {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  Source source = 3;
  oneof payload {
    SessionEvent session = 10;
  }
  reserved 11, 12;
}

syntax = "proto3";

package arc.v1;

import "google/protobuf/timestamp.proto";

enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_MODEL = 1;
  SOURCE_USER = 2;
  SOURCE_SYSTEM = 3;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
}

message SessionCreated {
  string session_id = 1;
  string title = 2;
  string provider = 3;
  string model = 4;
  reserved 5, 6; // reserved for parent_session and fork_point
}

message MessageAppended {
  string session_id = 1;
  Role role = 2;
  string content = 3;
  // Reply was cut before the model finished; content is what the user saw.
  bool partial = 4;
  string turn_id = 5;
}

message ToolCallIssued {
  string session_id = 1;
  string turn_id = 2;
  string call_id = 3;
  uint32 index = 4;
  string name = 5;
  string arguments_json = 6;
  reserved 7, 8; // reserved for tool source (MCP server id) and issuing model
}

enum ToolOutcome {
  TOOL_OUTCOME_UNSPECIFIED = 0;
  TOOL_OUTCOME_OK = 1;
  TOOL_OUTCOME_ERROR = 2;
  TOOL_OUTCOME_UNKNOWN = 3;
}

message ToolResultRecorded {
  string session_id = 1;
  string turn_id = 2;
  string call_id = 3;
  ToolOutcome outcome = 4;
  string content = 5;
  bool truncated = 6;
  reserved 7; // reserved for structured (non-text) result content
}

message SessionConsolidated {
  string session_id = 1;
  // The last event the consolidation pass read; coverage, not a claim of output.
  uint64 through_seq = 2;
  // Empty until the extraction prompt is versioned (task 7.2).
  string prompt_version = 3;
}

message SessionEvent {
  oneof event {
    SessionCreated session_created = 1;
    MessageAppended message_appended = 2;
    ToolCallIssued tool_call_issued = 3;
    ToolResultRecorded tool_result_recorded = 4;
    SessionConsolidated session_consolidated = 6;
  }
  reserved 5; // reserved for a reasoning event; streamed-only by decision
}

message ProvenanceEntry {
  string session_id = 1;
  google.protobuf.Timestamp ts = 2;
}

message Provenance {
  // One entry per session that taught the record something, in the order they did.
  repeated ProvenanceEntry entries = 1;
}

message MemoryRecord {
  enum Kind {
    KIND_UNSPECIFIED = 0; // never written
    KIND_PERSON = 1;
    KIND_PROJECT = 2;
    KIND_PREFERENCE = 3;
    KIND_FACT = 4;
    KIND_DECISION = 5;
  }

  enum Status {
    STATUS_UNSPECIFIED = 0; // never written
    STATUS_ACTIVE = 1;
    STATUS_SUPERSEDED = 2;
  }

  string id = 1;
  Kind kind = 2;
  string namespace = 3; // "global" or a project id
  string title = 4;
  string summary = 5; // one line; appears in the always-loaded index
  string body = 6;
  repeated string links = 7; // related record ids
  Provenance provenance = 8;
  Status status = 9;
}

message MemoryRecordCreated {
  MemoryRecord record = 1;
}

message MemoryRecordUpdated {
  MemoryRecord record = 1;
}

message MemoryRecordSuperseded {
  string superseded_id = 1;
  // The replacement, whole; its id need not be superseded_id.
  MemoryRecord record = 2;
}

message MemoryRecordDeleted {
  // Id only: the projection excludes the record entirely, unlike SUPERSEDED.
  string id = 1;
}

// A review accept (DESIGN.md §5.4): the record was human-confirmed as-is.
// Durable because reviews are the ground truth precision labels rest on.
message MemoryRecordReviewed {
  string record_id = 1;
}

message MemoryEvent {
  // Writes carry the whole record, never a diff: replay is last write wins.
  oneof event {
    MemoryRecordCreated record_created = 1;
    MemoryRecordUpdated record_updated = 2;
    MemoryRecordSuperseded record_superseded = 3;
    MemoryRecordDeleted record_deleted = 4;
    MemoryRecordReviewed record_reviewed = 5;
  }
}

message Event {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  Source source = 3;
  oneof payload {
    SessionEvent session = 10;
    MemoryEvent memory = 11;
  }
  reserved 12; // reserved for IdentityEvent
}

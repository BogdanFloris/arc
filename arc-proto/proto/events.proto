syntax = "proto3";

package arc.v1;

import "google/protobuf/timestamp.proto";

enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_MODEL = 1;
  SOURCE_USER = 2;
  SOURCE_SYSTEM = 3;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
}

enum SessionRole {
  SESSION_ROLE_UNSPECIFIED = 0;
  SESSION_ROLE_CONCIERGE = 1;
  SESSION_ROLE_EXECUTOR = 2;
  SESSION_ROLE_ARCHIVIST = 3;
}

message Budget {
  uint64 total_tokens = 1;
  uint32 wall_clock_seconds = 2;
}

// What a session's workspace tools may reach, resolved from config when the
// session is created. Recorded here because replay has to rebuild what a tool
// call was allowed to see; config can change, the log cannot.
message WorkspaceGrant {
  string root = 1;
  bool read_write = 2;
}

message SessionCreated {
  string session_id = 1;
  string title = 2;
  string provider = 3;
  string model = 4;
  reserved 5, 6;  // forking's parent_session and fork_point
  SessionRole role = 7;
  string project = 8;
  Budget budget = 9;
  repeated WorkspaceGrant grants = 10;
  // the dispatching parent, set only for a job session's own creation
  string dispatched_by = 11;
}

message MessageAppended {
  string session_id = 1;
  Role role = 2;
  string content = 3;
  bool partial = 4;
  string turn_id = 5;
  // the turn's usage and wall time, stamped only on its final assistant message
  uint32 input_tokens = 6;
  uint32 output_tokens = 7;
  uint32 elapsed_ms = 8;
}

message ToolCallIssued {
  string session_id = 1;
  string turn_id = 2;
  string call_id = 3;
  uint32 index = 4;
  string name = 5;
  string arguments_json = 6;
  reserved 7, 8;  // tool source and issuing model
  bytes provider_roundtrip = 9;
}

enum ToolOutcome {
  TOOL_OUTCOME_UNSPECIFIED = 0;
  TOOL_OUTCOME_OK = 1;
  TOOL_OUTCOME_ERROR = 2;
  TOOL_OUTCOME_UNKNOWN = 3;
}

message ToolResultRecorded {
  string session_id = 1;
  string turn_id = 2;
  string call_id = 3;
  ToolOutcome outcome = 4;
  string content = 5;
  bool truncated = 6;
  reserved 7;  // structured, non-text result content
}

message SessionConsolidated {
  string session_id = 1;
  uint64 through_seq = 2;
  string prompt_version = 3;
}

message SessionEvent {
  oneof event {
    SessionCreated session_created = 1;
    MessageAppended message_appended = 2;
    ToolCallIssued tool_call_issued = 3;
    ToolResultRecorded tool_result_recorded = 4;
    SessionConsolidated session_consolidated = 6;
    SessionTitled session_titled = 7;
  }
  reserved 5;  // a reasoning event; streamed-only by decision
}

// The latest title wins on replay; retitling is appending another one.
message SessionTitled {
  string session_id = 1;
  string title = 2;
}

message ProvenanceEntry {
  string session_id = 1;
  google.protobuf.Timestamp ts = 2;
}

message Provenance {
  repeated ProvenanceEntry entries = 1;
}

message MemoryRecord {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PERSON = 1;
    KIND_PROJECT = 2;
    KIND_PREFERENCE = 3;
    KIND_FACT = 4;
    KIND_DECISION = 5;
  }

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_SUPERSEDED = 2;
  }

  string id = 1;
  Kind kind = 2;
  string namespace = 3;
  string title = 4;
  string summary = 5;
  string body = 6;
  repeated string links = 7;
  Provenance provenance = 8;
  Status status = 9;
}

message MemoryRecordCreated {
  MemoryRecord record = 1;
}

message MemoryRecordUpdated {
  MemoryRecord record = 1;
}

message MemoryRecordSuperseded {
  string superseded_id = 1;
  MemoryRecord record = 2;
}

message MemoryRecordDeleted {
  string id = 1;
}

message MemoryRecordReviewed {
  string record_id = 1;
}

message MemoryEvent {
  oneof event {
    MemoryRecordCreated record_created = 1;
    MemoryRecordUpdated record_updated = 2;
    MemoryRecordSuperseded record_superseded = 3;
    MemoryRecordDeleted record_deleted = 4;
    MemoryRecordReviewed record_reviewed = 5;
  }
}

message Event {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  Source source = 3;
  oneof payload {
    SessionEvent session = 10;
    MemoryEvent memory = 11;
  }
  reserved 12;  // IdentityEvent, if identity ever stops being a file
}
